name: ALLIGENT CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest flake8 black reportlab pydantic scikit-learn xgboost

    - name: Code Linting
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=alligent_frontend,node_modules,scripts/archive
        # Exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=alligent_frontend,node_modules,scripts/archive

    - name: Run Unit & Integration Tests
      run: |
        pytest -v tests/

    - name: Verify Diagnostic Benchmarks
      run: |
        python -m backend.run_benchmark
